<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Expense Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1><i class="fa-solid fa-wallet"></i> My Expense Tracker</h1>
<nav>
<a href="index.html"><button>Dashboard</button></a>
<a href="history.html"><button>History</button></a>
<a href="report.html"><button>Report</button></a>
</nav>
</header>

<main>
<section id="box">
<div>Balance: <span id="balance">0</span></div>
<div>Income: <span id="income">0</span></div>
<div>Expense: <span id="expense">0</span></div>
</section>

<section>
<h3>Add Transaction</h3>
<p id="errorMsg"></p>
<form id="form">
<input type="text" id="description" placeholder="Description" required>
<input type="number" id="amount" placeholder="Amount" required min="1">
<select id="type">
    <option value="expense">Expense</option>
    <option value="income">Income</option>
</select>
<input type="date" id="dateInput" required>
<button type="submit">Add</button>
</form>
</section>

<section>
<h3>Transactions</h3>
<ul id="list"></ul>
</section>
</main>

<footer>
<p><i class="fa-solid fa-envelope"></i> hexoblivion10@gmail.com</p>
<p>Created by Brown</p>
</footer>
<script src="app.js"></script>
</body>
</html>
