<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Expense History</h1>
  <nav><a href="index.html"><button>Dashboard</button>
</a><a href="history.html"><button>History</button>
</a><a href="report.html"><button>Report</button></a>
</nav>
</header>
<main><section><label>Filter by Month:</label><select id="monthFilter">
  <option value="all">All Months</option>
  <option value="01">January</option>
  <option value="02">February</option>
  <option value="03">March</option>
  <option value="04">April</option>
  <option value="05">May</option>
  <option value="06">June</option>
  <option value="07">July</option>
  <option value="08">August</option>
  <option value="09">September</option>
  <option value="10">October</option>
  <option value="11">November</option>
  <option value="12">December</option>
</select>
  <ul id="historyList"></ul></section></main>
<footer><p>Created by Brown</p></footer>
<script>
let transactions=JSON.parse(localStorage.getItem("transactions"))||[];
let historyList=document.getElementById("historyList");
let monthFilter=document.getElementById("monthFilter");
function renderHistory(filterMonth){
 historyList.innerHTML="";
 for(let i=0;i<transactions.length;i++){
  let t=transactions[i];
  let datePart=t.date.length>10?t.date.split("T")[0]:t.date;
  let parts=datePart.split("-");
  let month=parts[1];
  if(filterMonth==="all"||month===filterMonth){
    let li=document.createElement("li");
    li.textContent=t.description+" - "+t.amount+" - "+t.type+" - "+datePart;
    historyList.appendChild(li);
  }
 }
}
monthFilter.addEventListener("change",function()
{renderHistory(monthFilter.value);});
renderHistory("all");
</script>
</body>
</html>
