<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report</title>
    <link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>Monthly Report</h1><nav><a href="index.html">
    <button>Dashboard</button></a>
    <a href="history.html"><button>History</button></a>
    <a href="report.html"><button>Report</button></a></nav>
</header>
<main>
    <section>
        <ul id="reportList"></ul>
        <h3>Total Income: <span id="totalIncome">0</span></h3><h3>
            Total Expense: <span id="totalExpense">0</span></h3><h3>
    Balance: <span id="totalBalance">0</span></h3></section></main>
<footer><p>Created by Brown</p></footer>
<script>
let transactions=JSON.parse(localStorage.getItem("transactions"))||[];
let reportList=document.getElementById("reportList");
let income=0,expense=0;
reportList.innerHTML="";
for(let i=0;i<transactions.length;i++){
 let t=transactions[i];
 if(t.type==="income") income+=Number(t.amount); 
 else expense+=Number(t.amount);
 let datePart = t.date.split("T")[0];
 let li=document.createElement("li");
 li.textContent=t.description+" - "+t.amount+" - "+t.type+" - "+datePart;
 reportList.appendChild(li);
}
document.getElementById("totalIncome").textContent=income;
document.getElementById("totalExpense").textContent=expense;
document.getElementById("totalBalance").textContent=income-expense;
</script>
</body>
</html>
